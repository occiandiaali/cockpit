<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="car.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Road Sim – Start</title>
    <style>
      :root {
        --bg: #f3f5f8;
        --fg: #141a22;
        --card: #fff;
        --bd: #cfd6df;
        --ac: #1f7a45;
        --mut: #5b6672;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0b0f14;
          --fg: #f1f4f8;
          --card: #151c25;
          --bd: #2c3744;
          --ac: #5dff9a;
          --mut: #93a1b0;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0b0f14;
        --fg: #f1f4f8;
        --card: #151c25;
        --bd: #2c3744;
        --ac: #5dff9a;
        --mut: #93a1b0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.45 system-ui,
          sans-serif;
        padding: max(20px, env(safe-area-inset-top)) 16px
          max(20px, env(safe-area-inset-bottom));
      }
      main {
        width: 100%;
        max-width: 480px;
      }
      h1 {
        margin: 8px 0 2px;
        font-size: 26px;
      }
      p.s {
        margin: 0 0 20px;
        color: var(--mut);
      }
      label.t {
        display: block;
        font-weight: 600;
        margin: 18px 0 6px;
      }
      input[type="text"] {
        width: 100%;
        padding: 12px 14px;
        font: inherit;
        border-radius: 10px;
        border: 2px solid var(--bd);
        background: var(--card);
        color: var(--fg);
      }
      input[type="text"]:focus {
        outline: none;
        border-color: var(--ac);
      }
      .r {
        display: block;
        margin: 10px 0;
        padding: 14px;
        border-radius: 12px;
        border: 2px solid var(--bd);
        background: var(--card);
        cursor: pointer;
      }
      .r input {
        position: absolute;
        opacity: 0;
      }
      .r:has(input:checked) {
        border-color: var(--ac);
      }
      .r b {
        display: block;
      }
      .r span {
        color: var(--mut);
        font-size: 14px;
      }
      button {
        width: 100%;
        margin-top: 20px;
        padding: 14px;
        font: 700 17px system-ui;
        border: 0;
        border-radius: 12px;
        background: var(--ac);
        color: #06210f;
      }
      button:disabled {
        opacity: 0.4;
      }
      small {
        display: block;
        margin-top: 14px;
        color: var(--mut);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Road Sim</h1>
      <p class="s">Drive real roads from the driver’s seat.</p>
      <label class="t" for="u">Your driver name</label>
      <input
        id="u"
        type="text"
        maxlength="20"
        autocomplete="nickname"
        placeholder="e.g. Tunde"
      />
      <label class="t">Choose your route</label>
      <div id="routes"></div>
      <button id="done" disabled>Done</button>
      <small
        >Scene lighting follows your device clock. Traffic levels are presets
        for now; live data comes later.</small
      >
    </main>
    <script>
      const ROUTES = [
        {
          id: "third-mainland",
          name: "Third Mainland Bridge",
          city: "Lagos",
          info: "≈ 11.8 km lagoon bridge · usually heavy traffic",
        },
        {
          id: "abuja-kaduna",
          name: "A2 Abuja–Kaduna Highway",
          city: "Abuja → Kaduna",
          info: "Long expressway · typically lighter traffic",
        },
      ];
      const $ = (i) => document.getElementById(i);
      let sel = null;
      $("routes").innerHTML = ROUTES.map(
        (r) =>
          `<label class="r"><input type="radio" name="r" value="${r.id}"><b>${r.name}</b><span>${r.city} · ${r.info}</span></label>`,
      ).join("");
      try {
        $("u").value = localStorage.getItem("rs_user") || "";
        sel = localStorage.getItem("rs_route");
        const e = document.querySelector(`input[value="${sel}"]`);
        e && (e.checked = true);
      } catch (e) {}
      const ok = () => {
        const n = $("u").value.trim(),
          r = document.querySelector("input[name=r]:checked");
        sel = r ? r.value : null;
        $("done").disabled = !(n.length >= 2 && sel);
      };
      document.addEventListener("input", ok);
      ok();
      $("done").addEventListener("click", () => {
        const n = $("u").value.trim();
        try {
          localStorage.setItem("rs_user", n);
          localStorage.setItem("rs_route", sel);
        } catch (e) {}
        location.href =
          "game.html?u=" +
          encodeURIComponent(n) +
          "&r=" +
          encodeURIComponent(sel);
      });
    </script>
  </body>
</html>
